{% extends 'base.html' %}
{% load static %}

{% block title %}Восстановление пароля - Свой Тыл{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h4 class="mb-0">Восстановление пароля</h4>
                </div>
                <div class="card-body">
                    <p class="text-muted mb-4">
                        Забыли пароль? Введите свой email, и мы отправим инструкцию по восстановлению.
                    </p>
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3">
                            <label for="id_email" class="form-label">Email</label>
                            <input type="email" name="email" class="form-control" id="id_email" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            Отправить инструкцию
                        </button>
                    </form>
                    <hr>
                    <div class="text-center">
                        <a href="{% url 'accounts:login' %}">Вернуться ко входу</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

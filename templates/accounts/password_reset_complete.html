{% extends 'base.html' %}
{% load static %}

{% block title %}Пароль изменен - Свой Тыл{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow">
                <div class="card-header bg-success text-white">
                    <h4 class="mb-0">Пароль успешно изменен</h4>
                </div>
                <div class="card-body text-center">
                    <i class="bi bi-check-circle" style="font-size: 48px; color: #28a745;"></i>
                    <p class="mt-3">Ваш пароль был успешно изменен. Теперь вы можете войти с новым паролем.</p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary mt-3">Войти</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
